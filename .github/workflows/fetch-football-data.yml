name: Fetch Football Data

# Grabs upcoming fixtures from football-data.org into Supabase and then
# enriches them with venue / weather / lineups / past-match context from ESPN.

on:
  schedule:
    - cron: '0 */3 * * *' # every 3 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fetch_football_data.js'
      - '.github/scripts/package-lock.json'
      - '.github/scripts/package.json'
      - '.github/workflows/fetch-football-data.yml'
  # Gate PRs that touch the fetcher too — same path filters as the push
  # trigger above.
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/fetch_football_data.js'
      - '.github/scripts/package-lock.json'
      - '.github/scripts/package.json'
      - '.github/workflows/fetch-football-data.yml'

permissions:
  contents: read

concurrency:
  group: fetch-football-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch-and-store:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'   # native WebSocket (realtime-js requires Node >= 22)
          cache: npm
          cache-dependency-path: .github/scripts/package-lock.json

      - name: Install script dependencies
        # npm ci (not npm install): reproducible install straight from the
        # committed lockfile — drift between package.json and the lock fails
        # loudly here instead of silently changing production behaviour.
        run: npm ci
        working-directory: .github/scripts

      - name: Fetch football data and store in Supabase
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN || secrets.FOOTBALL_API_TOKEN || vars.FOOTBALL_DATA_TOKEN || vars.FOOTBALL_API_TOKEN }}
          FOOTBALL_DATA_TOKENS: ${{ secrets.FOOTBALL_DATA_TOKENS }}
          X_RAPIDAPI_KEY: ${{ secrets.X_RAPIDAPI_KEY || vars.X_RAPIDAPI_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE || vars.SUPABASE_SERVICE_ROLE_KEY }}
          # Node reads NODE_ vars; the JS script also accepts the SUPABASE_* names.
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE || vars.SUPABASE_SERVICE_ROLE_KEY }}
        run: node .github/scripts/fetch_football_data.js

      # This step used to be skipped by the runner silently: it ran
      # `python3 ai/enrich_match_details.py` on a bare interpreter with no
      # dependencies installed, then continued on error. Install first, and
      # only tolerate failures from the third-party APIs it calls.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai/requirements.txt

      - name: Install Python dependencies
        run: pip install -r ai/requirements.txt

      - name: Enrich predictions with match details (venue, weather, lineups)
        continue-on-error: true   # supplemental: never fail the data fetch over ESPN/Open-Meteo
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE || vars.SUPABASE_SERVICE_ROLE_KEY }}
        run: python ai/enrich_match_details.py
