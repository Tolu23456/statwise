name: Fetch Football Data

on:
  schedule:
    - cron: '0 */3 * * *' # every 3 hours; also cron: '30 06,18 * * *' to run twice daily? Or prefer 3h; alternatively 0 6,12,18 * * * 
    - cron: '0 6,12,18 * * *' # 3x daily at 06:00,12:00,18:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fetch_football_data.js'
      - '.github/workflows/fetch-football-data.yml'

jobs:
  fetch-and-store:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'   # native WebSocket (realtime-js requires Node >= 22)

      - name: Install script dependencies
        run: npm install
        working-directory: .github/scripts

      - name: Fetch football data and store in Supabase
        env:
          FOOTBALL_DATA_TOKEN: ${{ vars.FOOTBALL_DATA_TOKEN }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ vars.SUPABASE_SERVICE_ROLE_KEY }}
        run: node .github/scripts/fetch_football_data.js

      - name: Enrich predictions with match details (venue, weather, lineups)
        continue-on-error: true   # supplemental: never fail the data fetch over ESPN/Open-Meteo
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ vars.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 ai/enrich_match_details.py
