name: Retrain Model Weekly

# Retrains on CI and only replaces the deployed model when it wins on the
# identical out-of-time holdout (ai/retrain.py::gate).  A rejection is the
# gate doing its job, so the job reports success with a summary instead of
# going red — a permanently-red scheduled job is one nobody reads.

on:
  schedule:
    - cron: '0 3 * * 1'  # Every Monday at 3 AM UTC
  workflow_dispatch:
    inputs:
      synth_labels:
        description: 'Distill Monte Carlo lab soft labels into training (step 1.5)'
        default: '0'
      synth_fraction:
        description: 'Fraction of train rows receiving a teacher-labeled duplicate'
        default: '0.5'

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r ai/requirements.txt

      # Cheap guards before spending 20 minutes on a training run: de-vig,
      # odds validity, alpha damping (step 1.4) and the weather join (1.2).
      - name: Unit tests
        run: |
          python ai/experimental/test_alpha_blend.py
          python ai/experimental/test_weather.py
          # Leak-fix regressions: inference history, canonical league slugs,
          # batch form/travel blocks, and the self-leak date guard.
          python ai/experimental/test_leak_fixes.py
          # Monte Carlo Match Lab (step 1.5): sampler, breeding, merge math.
          python ai/experimental/test_sim.py
          # Plan 1.6: BTTS/O3.5 labels + auxiliary heads + pickle round-trip.
          python ai/experimental/test_markets.py
          # Plan 2.2: live-window enrichment (window policy, merge, ESPN parse).
          python ai/experimental/test_live_feed.py
          # Plan 2.3: booking-code cache, retries, friendly errors, stats.
          python ai/experimental/test_booking.py
          # Plan 2.4: settlement source-order, day-leak guard, alerts.
          python ai/experimental/test_settle.py

      - name: Retrain model
        id: retrain
        # Same training environment as train-model.yml — the two must produce
        # comparable holdout numbers or the gate is comparing different things.
        env:
          HOLDOUT_DAYS: '180'
          RECENCY_HALF_LIFE_DAYS: '1460'
          STAGE_B: '0'
          MODEL_MODE: 'both'
          # Step 1.5 distillation: default OFF for the scheduled run; the
          # dispatch input turns it on for the apples-to-apples test.  The
          # teacher recipe (ai/data/sim/worlds.json) and its split-vs-holdout
          # guard live in ai/sim/distill.py — a stale/missing recipe skips
          # silently rather than training on smuggled holdout outcomes.
          SYNTH_LABELS: ${{ inputs.synth_labels || '0' }}
          SYNTH_FRACTION: ${{ inputs.synth_fraction || '0.5' }}
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
          OPENBLAS_NUM_THREADS: '4'
          NUMEXPR_NUM_THREADS: '4'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          set -o pipefail
          rc=0
          mkdir -p ai/models
          # -u: progress lines must stream, not sit in a pipe buffer for 20 min
          (cd ai && python -u retrain.py) 2>&1 | tee retrain.log || rc=$?

          outcome=trained
          if [ "$rc" -ne 0 ]; then
            # retrain.py exits non-zero when the holdout gate keeps the current
            # model.  Distinguish that from a real crash by looking for the
            # decision it records in model_info.json.
            decision=$(python - <<'PY'
          import json, os
          p = os.path.join("ai", "data", "model_info.json")
          try:
              info = json.load(open(p))
              rej = info.get("last_rejected") or {}
              print(rej.get("decision") or "")
          except Exception:
              print("")
          PY
            )
            if [ "$decision" = "rejected" ]; then
              outcome=gate-rejected
              rc=0
            else
              outcome=crashed
            fi
          fi
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"

          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          p = os.path.join("ai", "data", "model_info.json")
          try:
              info = json.load(open(p))
          except Exception:
              print("model_info.json missing"); raise SystemExit
          cal = info.get("calibration") or {}
          rej = info.get("last_rejected") or {}
          print("### Retrain")
          print(f"- model version: **{info.get('version')}** (`{str(info.get('git_sha'))[:8]}`)")
          for k in ("mode", "eval_log_loss", "market_log_loss", "market_closing_log_loss",
                    "blended_market_log_loss", "accuracy", "brier", "ece", "alpha_default",
                    "alpha_fitted_raw", "alpha_damp_weight", "alpha_leagues", "split_at"):
              if k in cal:
                  print(f"- {k}: {cal[k]}")
          if rej.get("decision") == "rejected":
              print(f"- **gate: REJECTED** (ll {rej.get('baseline_eval_log_loss')} -> "
                    f"{rej.get('new_eval_log_loss')}, delta {rej.get('delta_log_loss')}, "
                    f"tolerance {rej.get('tolerance')}) — deployed model kept")
          elif info.get("version"):
              print(f"- gate: accepted (version {info.get('version')})")
          hist = info.get("history") or []
          if hist:
              last = hist[-1]
              print(f"- previous: version {last.get('previous', {}).get('version')} "
                    f"ll {last.get('previous', {}).get('eval_log_loss')}")
          PY

          exit "$rc"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrain-log
          path: retrain.log
          if-no-files-found: ignore

      # The .pkl is gitignored, so without these two steps a weekly retrain
      # trained a model and then threw the weights away — only model_info.json
      # survived, and predict.yml kept restoring the older train-model cache.
      - name: Publish model to cache (restored by the prediction workflow)
        if: steps.retrain.outputs.outcome == 'trained'
        # save-only: actions/cache would restore an existing entry first and
        # overwrite the model we just trained.  run_id keeps every save unique;
        # predict.yml restores the newest via the statwise-model-v2- prefix.
        uses: actions/cache/save@v4
        with:
          path: ai/models/football_predictor.pkl
          key: statwise-model-v2-${{ github.run_id }}-${{ hashFiles('ai/model/trainer.py', 'ai/model/features.py') }}

      - name: Publish artifact
        if: steps.retrain.outputs.outcome == 'trained'
        uses: actions/upload-artifact@v4
        with:
          name: football-predictor
          path: |
            ai/models/football_predictor.pkl
            ai/data/model_info.json
          compression-level: 9
          retention-days: 30

      - name: Upload model to Supabase storage
        if: steps.retrain.outputs.outcome == 'trained'
        continue-on-error: true   # large objects may exceed storage limits
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || vars.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::notice::no service key configured — skipping storage upload"
            exit 0
          fi
          curl -sS -X POST \
            "$SUPABASE_URL/storage/v1/object/app-assets/models/football_predictor.pkl?upsert=true" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/octet-stream" \
            -H "x-upsert: true" \
            --data-binary @ai/models/football_predictor.pkl

      - name: Commit and push if changed
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add ai/data/model_info.json || true
          if ! git diff --staged --quiet; then
            git commit -m "Auto-retrain: $(date -u +%Y-%m-%d)"
            # main may have moved while training ran (other workflows push too)
            git pull --rebase origin main
            git push
          fi
