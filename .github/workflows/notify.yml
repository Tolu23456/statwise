name: Notify

# Push notifications + social layer (2026-10-27; native Expo push added when
# statwise/ was converted from a PWA to an Android app).
#
# Six kinds, all idempotent (dedupe state in app_settings.notify_state,
# except inbox which dedupes on the notifications table's push_sent_at):
#   kickoff    — matches starting in the next ~30 min (cron every 15 min),
#                tier-gated, EXCLUDES users who bookmarked the match
#   bookmarked — the personal "your bookmarked match starts soon" alert for
#                exactly those users (user_favorites), same 15-min cron
#   picks      — new AI Picks since the last picks run, grouped per tier
#                rank so a pick only reaches users entitled to see it
#   settled    — AI Picks that settled correctly, tier-gated like picks
#   odds       — >= 5% odds moves on bookmarked upcoming AI Picks,
#                premium+ users, <= 1 alert per match per day
#   inbox      — reply/mention rows the DB trigger wrote, pushed to the
#                addressee and stamped push_sent_at (rows age out at 24h)
#
# Delivery: Expo push tokens in `push_tokens`, one row per Android
# install, sent to Expo's push API.  Works WITHOUT any secret;
# EXPO_ACCESS_TOKEN only raises the rate limit.
# Table: supabase-native-push-migration.sql.  Web push was removed with
# the PWA → Android conversion (no sw.js, no VAPID key, no
# push_subscriptions reads).
#
# The social kinds additionally need section 4 of
# supabase-pending-migrations.sql (user_favorites + notifications).
# Missing tables/secrets make that path exit 0 with a note: notifications
# are optional, never break the app.

on:
  schedule:
    # Every 15 min: the kickoff window is 25 min, so two ticks always
    # cover it; :07 offset avoids the :00 thundering herd.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      kind:
        description: 'Which notifications to send'
        required: true
        default: 'kickoff'
        type: choice
        options:
          - kickoff
          - bookmarked
          - picks
          - settled
          - odds
          - inbox
      dry_run:
        description: 'Dry run (gather + log, send nothing)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: notify-${{ github.event.inputs.kind || 'kickoff' }}
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai/requirements.txt

      - name: Install dependencies
        run: pip install -r ai/requirements.txt

      - name: Send notifications
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE || vars.SUPABASE_SERVICE_ROLE_KEY }}
          # Optional: raises Expo's push rate limit; empty falls back to
          # anonymous push. SITE_BASE_URL pins the absolute origin native
          # push data.url carries (must match the app's trusted origin in
          # app/_layout.tsx — empty uses the same default on both sides).
          # Web push (VAPID_PRIVATE_KEY) was removed with the Android
          # conversion — nothing reads push_subscriptions any more.
          EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL || vars.SITE_BASE_URL }}
        run: |
          if [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY is not configured — cannot notify."
            exit 1
          fi
          # Scheduled runs fan out to every kind (each is a cheap no-op
          # when nothing changed). Order matters: kickoff EXCLUDES
          # bookmarkers, so bookmarked runs right after it to give those
          # users their personal alert instead of the generic one.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python ai/notify.py --kind kickoff
            python ai/notify.py --kind bookmarked
            python ai/notify.py --kind odds
            python ai/notify.py --kind inbox
            python ai/notify.py --kind picks
            python ai/notify.py --kind settled
          else
            EXTRA=""
            if [ "${{ inputs.dry_run }}" = "true" ]; then EXTRA="--dry-run"; fi
            # shellcheck disable=SC2086
            python ai/notify.py --kind ${{ inputs.kind }} $EXTRA
          fi
