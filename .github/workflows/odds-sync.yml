name: Odds Sync (The Odds API)

# Pulls real bookmaker prices onto the predictions (stats.odds_home/draw/away,
# stats.value_edge, the `odds` column) and stores a snapshot per fixture.
#
# Credits: The Odds API charges 1 credit per league request (h2h x eu).
# The pool is shared across ODDS_API_KEYS (one free account = 500/month), and
# ai/odds_sync.py skips any league whose snapshot is younger than
# --max-age-hours, so a run only spends credits on leagues that need a refresh.

on:
  schedule:
    # pre-match odds — 4×/day
    - cron: '0 5,11,17,23 * * *'
    # in-play sync — every 5 min during match windows; costs credits ONLY when
    # matches are actually live. Enable with repo variable ODDS_LIVE_SYNC=true
    - cron: '*/5 12-22 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode to run'
        required: false
        default: 'prematch'
        type: choice
        options: [prematch, inplay]
      max_age_hours:
        description: 'Skip leagues fetched within this many hours (0 = always refresh)'
        required: false
        default: '6'
        type: string

permissions:
  contents: read

# Split per mode (audit M-36): inplay fires every 5 min and pre-match 4×/day,
# and sharing one group meant a backlog of queued inplay runs delayed a pending
# pre-match refresh. Each mode now serializes against ITSELF only, so the two
# schedules never block one another.
concurrency:
  group: odds-sync-${{ github.event.inputs.mode || github.event.schedule }}
  cancel-in-progress: false

jobs:
  prematch:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'prematch') ||
      github.event.schedule == '0 5,11,17,23 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai/requirements.txt

      # This job used to fail immediately with ModuleNotFoundError: joblib —
      # the workflow never installed the project dependencies.
      - name: Install dependencies
        run: pip install -r ai/requirements.txt

      - name: Fetch pre-match odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY || vars.ODDS_API_KEY }}
          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || vars.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$ODDS_API_KEY$ODDS_API_KEYS" ]; then
            echo "::error::No Odds API key configured — add the ODDS_API_KEYS repo secret."
            exit 1
          fi
          python ai/odds_sync.py prematch --window-days 10 \
            --max-age-hours "${{ inputs.max_age_hours || '6' }}"

  inplay:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'inplay') ||
      (github.event.schedule == '*/5 12-22 * * *' && vars.ODDS_LIVE_SYNC == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai/requirements.txt

      - name: Install dependencies
        run: pip install -r ai/requirements.txt

      - name: In-play states (live score + live odds)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY || vars.ODDS_API_KEY }}
          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || vars.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$ODDS_API_KEY$ODDS_API_KEYS" ]; then
            echo "::error::No Odds API key configured — add the ODDS_API_KEYS repo secret."
            exit 1
          fi
          python ai/odds_sync.py inplay --alpha 0.5
