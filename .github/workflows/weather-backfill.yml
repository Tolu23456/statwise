name: Weather Backfill

# Fills ai/data/weather_by_match.csv.gz — the per-match weather sidecar that
# retrain.py left-joins into the training set (feature slots 133-140).
#
# It was empty before: the lookup rounded coordinates to 0.1° while the fetch
# grid is 0.5°, so almost every row missed.  Fixed in
# ai/enrich_weather_history.py; the fetch itself (889 grid cities) is
# network-heavy, so it runs here rather than on the dev box.
#
# The sidecar is tracked in git — without it CI retrain trains with every
# weather feature blank while live inference feeds real forecasts.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 0'   # Sundays 04:00 UTC, so recent dates re-resolve

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    # A full pass is ~889 cities of 2000->today archive fetches; 429 back-offs
    # (120s each) make 60 minutes too tight. The fetch cache below makes every
    # run resume from the last one, so a timeout costs nothing but wall time.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai/requirements.txt

      - name: Install dependencies
        run: pip install -r ai/requirements.txt

      - name: Unit tests (weather integration)
        run: python ai/experimental/test_weather.py

      # ai/data/weather_cache/ is gitignored (hundreds of MB), so without this
      # every run refetched all 889 cities and the runner died holding the only
      # copy. Restore the newest previous save, then always save this attempt.
      - name: Restore fetch cache
        uses: actions/cache/restore@v4
        with:
          path: ai/data/weather_cache
          key: weather-cache-${{ github.run_id }}
          restore-keys: |
            weather-cache-

      - name: Backfill weather for all matches
        run: |
          set -o pipefail
          # -u: without it every pre-fetch print sits in a block-buffered pipe
          # and is lost when the runner is cancelled — the last run logged
          # nothing at all for 60 minutes.
          python -u ai/enrich_weather_history.py 2>&1 | tee backfill.log

      - name: Save fetch cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ai/data/weather_cache
          key: weather-cache-${{ github.run_id }}

      - name: Coverage report
        if: always()
        run: |
          python -u ai/enrich_weather_history.py --stats 2>&1 | tee -a backfill.log \
            | sed 's/^/```\n/; $a```' >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push if changed
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add ai/data/weather_by_match.csv.gz ai/data/team_venues.json || true
          if ! git diff --staged --quiet; then
            git commit -m "data: weather backfill $(date -u +%Y-%m-%d)"
            # main may have moved while this job ran (other workflows push too)
            git pull --rebase origin main
            git push
          fi

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weather-backfill-log
          path: backfill.log
          if-no-files-found: ignore
