name: StatWise AI Predictions

on:
  schedule:
    - cron: "0 */4 * * *"   # every 4 hours
  workflow_dispatch:         # manual trigger from GitHub UI

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('ai/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Restore trained model
        # restore-only: the predict run must never write a second copy
        uses: actions/cache/restore@v4
        with:
          path: ai/models/football_predictor.pkl
          key: statwise-model-v2-${{ github.run_id }}-${{ hashFiles('ai/model/trainer.py', 'ai/model/features.py') }}
          restore-keys: |
            statwise-model-v2-

      - name: Install dependencies
        run: |
          pip install -r ai/requirements.txt

      - name: Run prediction cycle
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN || vars.FOOTBALL_DATA_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE || vars.SUPABASE_SERVICE_ROLE_KEY }}
          THESPORTSDB_KEY: ${{ secrets.THESPORTSDB_KEY || vars.THESPORTSDB_KEY }}
        run: python ai/scheduler.py --once
