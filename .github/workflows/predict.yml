name: StatWise AI Predictions

# One-shot pipeline: fetch fixtures → predict → push → settle finished matches.
# Runs every 4 hours and on demand.

on:
  schedule:
    - cron: "0 */4 * * *"   # every 4 hours
  workflow_dispatch:         # manual trigger from GitHub UI

concurrency:
  group: predict
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('ai/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Restore trained model
        # restore-only: the predict run must never write a second copy
        uses: actions/cache/restore@v4
        with:
          path: ai/models/football_predictor.pkl
          key: statwise-model-v2-${{ github.run_id }}-${{ hashFiles('ai/model/trainer.py', 'ai/model/features.py') }}
          restore-keys: |
            statwise-model-v2-

      - name: Install dependencies
        run: |
          pip install -r ai/requirements.txt

      - name: Run prediction cycle
        id: predict
        env:
          # Support both secret names used across the project's history.
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN || secrets.FOOTBALL_API_TOKEN || vars.FOOTBALL_DATA_TOKEN || vars.FOOTBALL_API_TOKEN }}
          FOOTBALL_DATA_TOKENS: ${{ secrets.FOOTBALL_DATA_TOKENS }}
          X_RAPIDAPI_KEY: ${{ secrets.X_RAPIDAPI_KEY || vars.X_RAPIDAPI_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE || vars.SUPABASE_SERVICE_ROLE_KEY }}
          THESPORTSDB_KEY: ${{ secrets.THESPORTSDB_KEY || vars.THESPORTSDB_KEY }}
        run: python ai/scheduler.py --once

      # ── SportyBet booking code ─────────────────────────────────────────
      # Builds the accumulator from the AI Picks just published. Non-fatal:
      # the app falls back to a copyable selection slip if SportyBet is down.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Playwright Chromium
        if: always() && steps.predict.outcome != 'skipped'
        continue-on-error: true
        run: python -m playwright install chromium

      - name: Generate SportyBet booking code
        if: always() && steps.predict.outcome != 'skipped'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE || vars.SUPABASE_SERVICE_ROLE_KEY }}
        run: python ai/sportybet_booking.py

      # Settlement has its own workflow (settle.yml) too, but running it here
      # as well means a finished match is scored right after the next predict
      # run even if the dedicated job is paused. `if: always()` keeps it going
      # when the predict step itself failed.
      - name: Settle finished matches
        if: always() && steps.predict.outcome != 'skipped'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE || vars.SUPABASE_SERVICE_ROLE_KEY }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN || secrets.FOOTBALL_API_TOKEN || vars.FOOTBALL_DATA_TOKEN || vars.FOOTBALL_API_TOKEN }}
          FOOTBALL_DATA_TOKENS: ${{ secrets.FOOTBALL_DATA_TOKENS }}
          THESPORTSDB_KEY: ${{ secrets.THESPORTSDB_KEY || vars.THESPORTSDB_KEY }}
        run: python ai/settle_predictions.py
