name: App tests

# Frontend/unit guards that don't belong in the model retrain pipeline.
# Currently:
#   - plan 2.1 polling policy (tiered cadence, visibility and network gating)
#   - plan 2.2 live-state helpers (freshness gating, live chips, scores)
#   - plan 3.2 web-push helpers (base64url VAPID key, subscription row)
#   - plan 3.3 AI Picks surfacing (jsonb flag, certainty ranking/tone)
#   - plan 3.4 error copy (no raw errors in the UI) + offline detection
#   - plan 4.1 query cache policy (stale/gc budgets, retry bounds, keys)
#   - plan 4.3 input validation, rate limiting, booking-code guards
#   - plan 4.4 telemetry core (event caps, no-op contract, slow-query predicate)
#   - plan 4.5 A/B experiment framework (bucketing, config, sample run)
# Pure Node, no npm install needed.

on:
  workflow_dispatch:
  push:
    paths:
      - 'statwise/lib/**'
      - 'statwise/app/**'
      - '.github/workflows/test-app.yml'

jobs:
  frontend-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Polling policy tests (plan 2.1)
        run: |
          # Compile the policy + test with a pinned TypeScript, then run on
          # plain Node — no dependency install, works on any node >= 18.
          npx --yes -p typescript@5.9.3 tsc \
            statwise/lib/polling.ts statwise/lib/polling.test.ts \
            --outDir "$RUNNER_TEMP/polling-test" \
            --module commonjs --target es2019 --strict --skipLibCheck
          node "$RUNNER_TEMP/polling-test/polling.test.js"
      - name: Live-state helper tests (plan 2.2)
        run: |
          npx --yes -p typescript@5.9.3 tsc \
            statwise/lib/liveFeed.ts statwise/lib/liveFeed.test.ts \
            --outDir "$RUNNER_TEMP/livefeed-test" \
            --module commonjs --target es2019 --strict --skipLibCheck
          node "$RUNNER_TEMP/livefeed-test/liveFeed.test.js"
      - name: Web-push helper tests (plan 3.2)
        run: |
          npx --yes -p typescript@5.9.3 tsc \
            statwise/lib/push.ts statwise/lib/push.test.ts \
            --outDir "$RUNNER_TEMP/push-test" \
            --module commonjs --target es2019 --strict --skipLibCheck
          node "$RUNNER_TEMP/push-test/push.test.js"
      - name: AI Picks surfacing tests (plan 3.3)
        run: |
          npx --yes -p typescript@5.9.3 tsc \
            statwise/lib/aiPicks.ts statwise/lib/aiPicks.test.ts \
            --outDir "$RUNNER_TEMP/aipicks-test" \
            --module commonjs --target es2019 --strict --skipLibCheck
          node "$RUNNER_TEMP/aipicks-test/aiPicks.test.js"
      - name: Error copy tests (plan 3.4)
        run: |
          npx --yes -p typescript@5.9.3 tsc \
            statwise/lib/errors.ts statwise/lib/errors.test.ts \
            --outDir "$RUNNER_TEMP/errors-test" \
            --module commonjs --target es2019 --strict --skipLibCheck
          node "$RUNNER_TEMP/errors-test/errors.test.js"
      - name: Network/offline tests (plan 3.4)
        run: |
          npx --yes -p typescript@5.9.3 tsc \
            statwise/lib/network.ts statwise/lib/network.test.ts \
            --outDir "$RUNNER_TEMP/network-test" \
            --module commonjs --target es2019 --strict --skipLibCheck
          node "$RUNNER_TEMP/network-test/network.test.js"
      - name: Quick-action tests (plan 3.5)
        run: |
          npx --yes -p typescript@5.9.3 tsc \
            statwise/lib/favorites.ts statwise/lib/favorites.test.ts \
            --outDir "$RUNNER_TEMP/favorites-test" \
            --module commonjs --target es2019 --strict --skipLibCheck
          node "$RUNNER_TEMP/favorites-test/favorites.test.js"
      - name: Query cache policy tests (plan 4.1)
        run: |
          npx --yes -p typescript@5.9.3 tsc \
            statwise/lib/queryConfig.ts statwise/lib/queryConfig.test.ts \
            --outDir "$RUNNER_TEMP/queryconfig-test" \
            --module commonjs --target es2019 --strict --skipLibCheck
          node "$RUNNER_TEMP/queryconfig-test/queryConfig.test.js"
      - name: Input validation tests (plan 4.3)
        run: |
          npx --yes -p typescript@5.9.3 tsc \
            statwise/lib/validation.ts statwise/lib/validation.test.ts \
            --outDir "$RUNNER_TEMP/validation-test" \
            --module commonjs --target es2019 --strict --skipLibCheck
          node "$RUNNER_TEMP/validation-test/validation.test.js"
      - name: Rate limit tests (plan 4.3)
        run: |
          npx --yes -p typescript@5.9.3 tsc \
            statwise/lib/rateLimit.ts statwise/lib/rateLimit.test.ts \
            --outDir "$RUNNER_TEMP/ratelimit-test" \
            --module commonjs --target es2019 --strict --skipLibCheck
          node "$RUNNER_TEMP/ratelimit-test/rateLimit.test.js"
      - name: Booking code guard tests (plan 4.3)
        run: |
          npx --yes -p typescript@5.9.3 tsc \
            statwise/lib/bookingGuard.ts statwise/lib/validation.ts \
            statwise/lib/bookingGuard.test.ts \
            --outDir "$RUNNER_TEMP/bookingguard-test" \
            --module commonjs --target es2019 --strict --skipLibCheck
          node "$RUNNER_TEMP/bookingguard-test/bookingGuard.test.js"
      - name: Telemetry core tests (plan 4.4)
        run: |
          npx --yes -p typescript@5.9.3 tsc \
            statwise/lib/telemetry.ts statwise/lib/telemetry.test.ts \
            statwise/lib/validation.ts statwise/lib/rateLimit.ts \
            --outDir "$RUNNER_TEMP/telemetry-test" \
            --module commonjs --target es2019 --strict --skipLibCheck
          node "$RUNNER_TEMP/telemetry-test/telemetry.test.js"
      - name: Experiment framework tests (plan 4.5)
        run: |
          npx --yes -p typescript@5.9.3 tsc \
            statwise/lib/experiments.ts statwise/lib/experiments.test.ts \
            statwise/lib/telemetry.ts statwise/lib/validation.ts \
            statwise/lib/rateLimit.ts \
            --outDir "$RUNNER_TEMP/experiments-test" \
            --module commonjs --target es2019 --strict --skipLibCheck
          node "$RUNNER_TEMP/experiments-test/experiments.test.js"
