name: Sync news

# Syndicates football news from Sky Sports and SportyTrader into
# website/src/data/news.json so the site's news section stays fresh
# WITHOUT Vercel rebuilds: the site reads the raw file at runtime
# (useNewsFeed), so committing it is enough. Each run also fetches the
# opening text of any story still missing it (bounded per run, default
# 8 pages; Sky stories come via JSON-LD, videos stored as kind:"video"),
# which is what the /news reader renders in-site.
# Pushes use GITHUB_TOKEN, which by design does NOT trigger other
# workflows — no deploy cascade from a headline.
on:
  schedule:
    - cron: '17 */2 * * *' # every 2h at :17 — off the :00 stampede
  workflow_dispatch: {}

# Least privilege by default; the single sync job below (which is the one
# that commits news.json) declares `contents: write` for itself.
permissions:
  contents: read

concurrency:
  group: sync-news
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the rebase before push below never conflicts on
          # an unrelated shallow boundary.
          fetch-depth: 0

      - name: Sync from SportyTrader
        timeout-minutes: 10
        run: python3 website/scripts/sync_news.py

      - name: Commit if changed
        timeout-minutes: 5
        run: |
          if git diff --quiet -- website/src/data/news.json; then
            echo "news.json unchanged — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/src/data/news.json
          git commit -m "chore(news): sync football news [auto]"
          # main may have moved since checkout (other bots push too) —
          # rebase our commit on top instead of getting a non-fast-forward.
          git pull --rebase origin main
          git push
