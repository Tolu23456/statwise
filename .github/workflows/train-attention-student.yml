name: Train Attention Student

# Plan 2.4 — trains the FT-Transformer-style student (torch, CPU only) on the
# real feature matrix + the Monte Carlo lab recipe as 13 extra teacher tokens,
# evaluates it once on the SAME out-of-time holdout ai/retrain.py uses, and —
# when race=true — hands the bundle to retrain.py so the student competes for
# deployment through the EXISTING gate (tolerance 0.0005, never FORCE_REPLACE).
# The gate decides what ships; this workflow only produces a candidate.
#
# Protocol guardrails baked in below:
#   * hyper-parameters / early stopping see a train-side inner tail only
#     (ai/attn/train.py) — the holdout is scored exactly once per run;
#   * the teacher recipe must have been fit before our split
#     (sim/distill.teacher_may_fit) or the student trains on neutral tokens;
#   * synthetic mass never becomes raw LightGBM rows — teacher input is
#     features + optional soft targets on REAL rows (ATTN_DISTILL_WEIGHT);
#   * torch is a train-time-only dependency; serving runs the verified
#     NumPy mirror (parity recorded in the report, hard-fails > 1e-3).

on:
  workflow_dispatch:
    inputs:
      distill_weight:
        description: 'Teacher soft-label mix on 1X2 targets (0 = off, tuned on inner val)'
        default: '0'
      distill_frac:
        description: 'Fraction of train rows receiving the soft mix'
        default: '0.3'
      epochs:
        description: 'Max epochs (early stop on the inner-val tail)'
        default: '12'
      seed:
        description: 'Training seed'
        default: '42'
      race:
        description: 'Race the trained student through the retrain gate'
        default: 'true'
      skip_lgbm_ref:
        description: 'Skip the in-run LightGBM reference (faster, less complete report)'
        default: 'false'

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai/requirements.txt

      - name: Install dependencies (torch CPU is train-time only)
        run: |
          pip install -r ai/requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Build C++ feature core
        run: make -C ai/core

      # Cheap guards before spending an hour on training: torch<->numpy parity,
      # fast-path teacher parity against the reference posterior, recipe guard,
      # bundle round-trip, a tiny training loop.
      - name: Unit tests
        run: |
          python ai/experimental/test_attention.py
          python ai/experimental/test_sim_scale.py

      - name: Train student
        id: train
        # Same holdout/recency environment as retrain-weekly.yml — the numbers
        # in the report and the gate must stay apples-to-apples.
        env:
          HOLDOUT_DAYS: '180'
          RECENCY_HALF_LIFE_DAYS: '1460'
          ATTN_DISTILL_WEIGHT: ${{ inputs.distill_weight || '0' }}
          ATTN_DISTILL_FRAC: ${{ inputs.distill_frac || '0.3' }}
          ATTN_EPOCHS: ${{ inputs.epochs || '12' }}
          ATTN_SEED: ${{ inputs.seed || '42' }}
          # batch 2048 would keep ~1 GB of attention maps per layer × 3 layers
          # × backward — 512 peaks ~2 GB, comfortably inside the 16 GiB runner.
          ATTN_BATCH: '512'
          ATTN_EVAL_CHUNK: '1024'
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
          OPENBLAS_NUM_THREADS: '4'
          NUMEXPR_NUM_THREADS: '4'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          set -o pipefail
          rc=0
          mkdir -p ai/models ai/attn/reports
          extra=""
          if [ "${{ inputs.skip_lgbm_ref }}" = "true" ]; then extra="--skip-lgbm"; fi
          (cd ai && python -u -m attn.train $extra) 2>&1 | tee attn-train.log || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          p = os.path.join("ai", "attn", "reports", "attn_report.json")
          try:
              r = json.load(open(p))
          except Exception:
              print("attn_report.json missing"); raise SystemExit
          ev, pico = r.get("eval", {}), r.get("pico_deployed", {})
          print("### Attention student")
          print(f"- verdict vs Pico: **{r.get('verdict_vs_pico')}**")
          for k in ("eval_log_loss", "raw_log_loss", "isotonic_log_loss", "accuracy",
                    "brier", "goals_brier", "btts_brier", "o35_brier",
                    "teacher_eval_log_loss", "market_log_loss",
                    "market_closing_log_loss", "blended_market_log_loss", "split_at"):
              if k in ev:
                  print(f"- {k}: {ev[k]}")
          print(f"- Pico deployed eval_log_loss: {pico.get('eval_log_loss')}")
          pr = r.get("protocol", {})
          print(f"- torch/numpy parity: {pr.get('torch_numpy_parity_max_abs')}")
          print(f"- teacher: {pr.get('teacher')}")
          print(f"- distillation: {pr.get('distillation')}")
          lg = r.get("lgbm_reference")
          if lg:
              print(f"- in-run LightGBM reference: ll {lg.get('eval_ll')} "
                    f"acc {lg.get('acc')} ({lg.get('seconds')}s)")
          print(f"- timings: {r.get('timing_s')}")
          PY
          exit "$rc"

      - name: Upload train artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attn-student-${{ github.run_id }}
          path: |
            ai/attn/reports/attn_report.json
            ai/models/attn_student.pkl
            attn-train.log
          if-no-files-found: ignore
          retention-days: 30

      # ── the race: SAME gate as the weekly retrain ────────────────────
      - name: Race through the retrain gate
        id: retrain
        if: inputs.race == 'true' && steps.train.outputs.rc == '0'
        env:
          HOLDOUT_DAYS: '180'
          RECENCY_HALF_LIFE_DAYS: '1460'
          STAGE_B: '0'
          MODEL_MODE: 'both'
          SYNTH_LABELS: '0'
          ATTN_STUDENT: ai/models/attn_student.pkl
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
          OPENBLAS_NUM_THREADS: '4'
          NUMEXPR_NUM_THREADS: '4'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          set -o pipefail
          rc=0
          (cd ai && python -u retrain.py) 2>&1 | tee retrain.log || rc=$?

          outcome=trained
          if [ "$rc" -ne 0 ]; then
            decision=$(python - <<'PY'
          import json, os
          p = os.path.join("ai", "data", "model_info.json")
          try:
              info = json.load(open(p))
              rej = info.get("last_rejected") or {}
              print(rej.get("decision") or "")
          except Exception:
              print("")
          PY
            )
            if [ "$decision" = "rejected" ]; then
              outcome=gate-rejected
              rc=0
            else
              outcome=crashed
            fi
          fi
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"

          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          p = os.path.join("ai", "data", "model_info.json")
          try:
              info = json.load(open(p))
          except Exception:
              print("model_info.json missing"); raise SystemExit
          cal = info.get("calibration") or {}
          rej = info.get("last_rejected") or {}
          print("### Gate (retrain race)")
          print(f"- model version: **{info.get('version')}** (`{str(info.get('git_sha'))[:8}`)")
          for k in ("mode", "eval_log_loss", "market_log_loss", "blended_market_log_loss",
                    "accuracy", "brier", "goals_brier", "split_at"):
              if k in cal:
                  print(f"- {k}: {cal[k]}")
          if rej.get("decision") == "rejected":
              print(f"- **gate: REJECTED** (ll {rej.get('baseline_eval_log_loss')} -> "
                    f"{rej.get('new_eval_log_loss')}, delta {rej.get('delta_log_loss')}, "
                    f"tolerance {rej.get('tolerance')}) — deployed model kept")
          elif info.get("version"):
              print(f"- gate: accepted (version {info.get('version')})")
          PY

          exit "$rc"

      - name: Upload race log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attn-race-log
          path: retrain.log
          if-no-files-found: ignore

      - name: Publish model to cache (restored by the prediction workflow)
        if: steps.retrain.outputs.outcome == 'trained'
        # save-only (actions/cache would restore first and clobber); predict.yml
        # restores the newest statwise-model-v2- entry.
        uses: actions/cache/save@v4
        with:
          path: ai/models/football_predictor.pkl
          key: statwise-model-v2-${{ github.run_id }}-${{ hashFiles('ai/model/trainer.py', 'ai/model/features.py') }}

      - name: Publish artifact
        if: steps.retrain.outputs.outcome == 'trained'
        uses: actions/upload-artifact@v4
        with:
          name: football-predictor-attn
          path: |
            ai/models/football_predictor.pkl
            ai/data/model_info.json
          compression-level: 9
          retention-days: 30

      - name: Commit gate metadata if changed
        if: always() && inputs.race == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add ai/data/model_info.json || true
          if ! git diff --staged --quiet; then
            git commit -m "Attention-student gate: $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
