version: "3.9"

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5000:5000"
    environment:
      - EXPO_NO_DEVTOOLS=1
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  ai-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.ai
    environment:
      - FOOTBALL_API_TOKEN=${FOOTBALL_API_TOKEN}
      - X_RAPIDAPI_KEY=${X_RAPIDAPI_KEY:-}
      # No default URL: a hardcoded fallback previously pointed at a DIFFERENT
      # Supabase project than the one the app uses (statwise/lib/supabase.ts),
      # which could silently write predictions to the wrong database. Fail
      # fast instead — export SUPABASE_URL (and SUPABASE_SERVICE_KEY) in .env.
      - SUPABASE_URL=${SUPABASE_URL:?SUPABASE_URL must be set}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY:-}
    volumes:
      - ai_models:/app/ai/models
      - ai_data:/app/ai/data
    restart: unless-stopped

volumes:
  ai_models:
  ai_data:
